version: '3.9'

services:
  web:
    build: .
    container_name: kittygram_backend
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - sqlite_data:/app
    env_file:
      - .env

  nginx:
    image: nginx:1.25-alpine
    container_name: kittygram_nginx
    ports:
      - "8000:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
  sqlite_data: